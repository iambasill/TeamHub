<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff;">
  <h2 style="color: #dc2626; margin: 0 0 12px;">Password Reset Code &#128272;</h2>
  <p style="color: #374151; font-size: 15px; line-height: 1.5; margin: 0 0 8px;">
    We received a request to reset your password. Use the code below:
  </p>
  <p style="text-align: center; margin: 24px 0;">
    <span style="display: inline-block; background: #fef2f2; color: #b91c1c; font-size: 28px; font-weight: bold; letter-spacing: 6px; padding: 12px 28px; border-radius: 6px;">
      {{otp}}
    </span>
  </p>
  <p style="color: #6b7280; font-size: 13px; line-height: 1.5; margin: 0;">
    This code expires in 10 minutes. If you didn't request this, you can safely ignore this email.
  </p>
</div>
