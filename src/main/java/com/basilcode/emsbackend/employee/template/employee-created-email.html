<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff;">
  <h2 style="color: #2563eb; margin: 0 0 12px;">Welcome to EMS, {{firstName}}! &#127881;</h2>
  <p style="color: #374151; font-size: 15px; line-height: 1.5; margin: 0 0 8px;">
    Your account has been created. Use the temporary password below to log in:
  </p>
  <p style="text-align: center; margin: 24px 0;">
    <span style="display: inline-block; background: #eff6ff; color: #1d4ed8; font-size: 24px; font-weight: bold; letter-spacing: 3px; padding: 12px 28px; border-radius: 6px;">
      {{temporaryPassword}}
    </span>
  </p>
  <p style="color: #6b7280; font-size: 13px; line-height: 1.5; margin: 0;">
    For your security, please change this password after your first login.
  </p>
</div>
