<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff;">
  <h2 style="color: #ba1a1a; margin: 0 0 12px;">Access removed</h2>
  <p style="color: #374151; font-size: 15px; line-height: 1.5; margin: 0 0 8px;">
    Hi {{firstName}}, your access to <strong>{{systemName}}</strong> has been removed.
  </p>
  <p style="color: #6b7280; font-size: 13px; line-height: 1.5; margin: 16px 0 0;">
    If you believe this is a mistake, contact your system administrator.
  </p>
</div>
