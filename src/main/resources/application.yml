spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: teamhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    # Was hardcoded to localhost:5432/store_api — Railway has no local Postgres, so this
    # now reads the Postgres plugin's injected vars (PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD)
    # instead. Falls back sensibly for local dev if PG* vars aren't set.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:store_api}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    # A later-versioned migration (announcement_audiences, V39) was applied to this DB before
    # several earlier-versioned ones (V34-38) existed on disk yet — a one-off sequencing gap
    # from active development, not a real ordering dependency between them (each of V34-38
    # creates its own independent new table). Safe to allow permanently rather than just
    # patching this one gap, since the same situation can recur while multiple features are
    # being built in parallel.
    out-of-order: true
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-time: 3600000
      refresh-expiration-time: 604800000
      cookie-secure: ${COOKIE_SECURE:true}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
app:
  mail:
    from-name: ${MAIL_FROM}
  employee:
    # Return the generated password in the POST /employees response so an admin
    # can hand it over directly. Needed while SMTP is unavailable, since the
    # password is otherwise unrecoverable once the email fails to send.
    return-temporary-password: ${RETURN_TEMP_PASSWORD:false}
  storage:
    type: ${STORAGE_TYPE:local}            # local | cloud
    provider: ${STORAGE_PROVIDER:}         # s3 | cloudinary | gcs | azure  (only when type=cloud)
    local:
      upload-dir: ${UPLOAD_DIR:uploads}
      base-url: ${BASE_URL:http://localhost:8080/api/v1}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
    gcs:
      bucket: ${GCS_BUCKET:}
    azure:
      container: ${AZURE_CONTAINER:}
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
server:
  port: 8080
  servlet:
    context-path: /api/v1